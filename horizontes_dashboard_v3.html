  AMARILLO: {dot:"#fbbf24",bg:"rgba(251,191,36,0.07)"},
  ROJO:     {dot:"#f87171",bg:"rgba(248,113,113,0.07)"},

// ─── Demo data (NVDA — test de integración real) ──────────────────────────────
const DEMO_SCORES = {

    ticker:"NVDA",perfil_inversor:"moderado",
    score_final:78.32,clasificacion:"STRONG BUY",
    graham_score_bruto:71,graham_peso:0.45,graham_aporte:31.95,
    murphy_score_bruto:74,murphy_peso:0.10,murphy_aporte:7.40,
    lynch_score_bruto:88,lynch_peso:0.20,lynch_aporte:17.60,
    investingpro_score_bruto:85,investingpro_peso:0.25,investingpro_aporte:21.25,
    es_cedear:false,vru_alerta_trampa:false,vru_valor_usd:null,

    alertas:["⚠️ RSI 71.65 — zona de sobrecompra. Murphy recomienda cautela en la entrada."],

const DEMO_SEM = [

  {indicador:"Inflación CPI YoY",region:"US",estado:"AMARILLO",valor_actual:2.90,unidad:"%",      notas:"PCE 2.7% — sobre target 2%. Fed espera 1 corte en 2026."},
  {indicador:"Riesgo País EMBI", region:"AR",estado:"AMARILLO",valor_actual:526, unidad:"bps",    notas:"Bajó de 1650 a 526 bps. Mejora fiscal Milei."},
  {indicador:"CCL",              region:"AR",estado:"AMARILLO",valor_actual:1465,unidad:"ARS/USD",notas:"Fuente: Bluelytics live."},
  {indicador:"S&P 500 / SMA200", region:"US",estado:"VERDE",   valor_actual:1.11,unidad:"ratio",  notas:"Tendencia alcista confirmada."},
];

// ─── Gauge SVG ────────────────────────────────────────────────────────────────
function GaugeArc({score}){
  const r=52,cx=70,cy=70,sw=11;
  const rad=a=>a*Math.PI/180;
  const pt=(a,rr)=>({x:cx+rr*Math.cos(rad(180-a)),y:cy-rr*Math.sin(rad(180-a))});
  const angle=Math.min((score/100)*180,179.9);
  const p0=pt(0,r),p1=pt(180,r),pA=pt(angle,r);
  const c=scoreColor(score);
  return h("svg",{width:140,height:82,viewBox:"0 0 140 82",style:{overflow:"visible"}},
    h("path",{d:`M ${p0.x} ${p0.y} A ${r} ${r} 0 0 1 ${p1.x} ${p1.y}`,fill:"none",stroke:"rgba(255,255,255,0.05)",strokeWidth:sw,strokeLinecap:"round"}),
    h("path",{d:`M ${p0.x} ${p0.y} A ${r} ${r} 0 ${angle>180?1:0} 1 ${pA.x} ${pA.y}`,fill:"none",stroke:c,strokeWidth:sw,strokeLinecap:"round",style:{filter:`drop-shadow(0 0 8px ${c}99)`,transition:"all .6s ease"}}),
    h("circle",{cx:pA.x,cy:pA.y,r:5,fill:c,style:{filter:`drop-shadow(0 0 5px ${c})`,transition:"all .6s ease"}})
  );
}

// ─── Supabase fetch ───────────────────────────────────────────────────────────
async function sbFetch(url,key,table,qs=""){
  const res=await fetch(`${url}/rest/v1/${table}?${qs}`,{
    headers:{apikey:key,Authorization:`Bearer ${key}`}
  });
  if(!res.ok){const t=await res.text();throw new Error(`${res.status}: ${t}`);}
  return res.json();
}

// ─── Config Modal ─────────────────────────────────────────────────────────────
function ConfigModal({current,onSave,onClose}){
  const [url,setUrl]=useState(current.url||"");
  const [key,setKey]=useState(current.key||"");
  const inp=s=>({width:"100%",background:"#0a0a08",border:"0.5px solid rgba(255,255,255,0.1)",borderRadius:8,padding:"9px 12px",fontSize:11,color:"#e8e5e0",fontFamily:"DM Mono,monospace",outline:"none",marginTop:5});
  return h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:16}},
    h("div",{style:{background:"#111110",border:"0.5px solid rgba(255,255,255,0.12)",borderRadius:14,padding:24,width:"100%",maxWidth:420}},
      h("div",{style:{fontSize:14,fontWeight:600,marginBottom:2}},"Conectar Supabase"),
      h("div",{style:{fontSize:11,color:"#555550",marginBottom:18}},"Usá la ",h("span",{style:{color:"#a78bfa"}},"anon key")," desde Settings → API en Supabase (empieza con eyJhbGci...)"),
      h("div",{style:{marginBottom:12}},
        h("div",{style:{fontSize:10,fontWeight:500,color:"#555550",letterSpacing:".06em"}},"SUPABASE_URL"),
        h("input",{value:url,onChange:e=>setUrl(e.target.value),placeholder:"https://xxxx.supabase.co",style:inp()})
      ),
      h("div",{style:{marginBottom:16}},
        h("div",{style:{fontSize:10,fontWeight:500,color:"#555550",letterSpacing:".06em"}},"ANON KEY (empieza con eyJhbGci...)"),
        h("input",{value:key,onChange:e=>setKey(e.target.value),placeholder:"eyJhbGci...",style:inp()})
      ),
      h("div",{style:{background:"rgba(96,165,250,0.07)",border:"0.5px solid rgba(96,165,250,0.2)",borderRadius:8,padding:"10px 12px",marginBottom:16,fontSize:10,color:"#60a5fa",lineHeight:1.7}},
        "Dónde encontrar la anon key: Supabase Dashboard → Settings → API → ",h("strong",null,"Project API keys → anon / public")
      ),
      h("div",{style:{display:"flex",gap:8}},
        h("button",{onClick:onClose,style:{flex:1,background:"rgba(255,255,255,0.05)",color:"#888580",borderRadius:8,padding:"9px",fontSize:12,border:"0.5px solid rgba(255,255,255,0.08)"}},"Cancelar"),
        h("button",{onClick:()=>onSave({url:url.trim(),key:key.trim()}),style:{flex:2,background:"#4ade80",color:"#0a0a08",borderRadius:8,padding:"9px",fontSize:12,fontWeight:600,border:"none"}},"Conectar y analizar →")
      )

}

// ─── App Principal ────────────────────────────────────────────────────────────
function App(){
  const [config,setConfig]       = useState({url:SUPABASE_URL_DEFAULT,key:SUPABASE_KEY_DEFAULT});
  const [showCfg,setShowCfg]     = useState(false);
  const [inputTk,setInputTk]     = useState("NVDA");
  const [perfil,setPerfil]       = useState("moderado");
  const [scores,setScores]       = useState(DEMO_SCORES);
  const [semaforo,setSemaforo]   = useState(DEMO_SEM);
  const [loading,setLoading]     = useState(false);
  const [error,setError]         = useState(null);
  const [isDemo,setIsDemo]       = useState(true);
  const [activeTk,setActiveTk]   = useState("NVDA");

  const current = scores[perfil] || null;
  const [top10,setTop10] = useState([]);
  const [loadingTop,setLoadingTop] = useState(false);

  const fetchTop10 = useCallback(async(p,cfg)=>{
    if(!cfg.url||!cfg.key) return;
    setLoadingTop(true);
    try{
      const rows = await sbFetch(cfg.url,cfg.key,"scoring_cache",
        `perfil_inversor=eq.${p}&select=ticker,score_final,clasificacion,es_cedear&order=score_final.desc&limit=10`);
      setTop10(rows);
    }catch(e){setTop10([]);}
    finally{setLoadingTop(false);}
  },[]);

  const fetchAll = useCallback(async(ticker,cfg)=>{
    if(!cfg.url||!cfg.key){setShowCfg(true);return;}
    setLoading(true);setError(null);
    try{
      const rows = await sbFetch(cfg.url,cfg.key,"scoring_cache",`ticker=eq.${ticker.toUpperCase()}&select=*`);
      const byP  = rows.reduce((a,r)=>({...a,[r.perfil_inversor]:r}),{});
      if(Object.keys(byP).length===0){
        setError(`No hay análisis cacheado para ${ticker.toUpperCase()}. Ejecutá el pipeline Python primero.`);
        setLoading(false);return;
      }
      setScores(byP);setActiveTk(ticker.toUpperCase());setIsDemo(false);
      fetchTop10(perfil,cfg);
      const sem = await sbFetch(cfg.url,cfg.key,"macro_semaforo","select=*&order=fecha_dato.desc&limit=10");
      if(sem.length) setSemaforo(sem);
    }catch(e){setError(e.message);}
    finally{setLoading(false);}
  },[]);

  const onSearch  = ()=>fetchAll(inputTk,config);
  const onCfgSave = cfg=>{
    setConfig(cfg);
    setShowCfg(false);
    // Cargar semáforo inmediatamente al conectar
    sbFetch(cfg.url,cfg.key,"macro_semaforo","select=*&order=fecha_dato.desc&limit=10")
      .then(sem=>{ if(sem.length) setSemaforo(sem); })
      .catch(()=>{});
    fetchAll(inputTk,cfg);
  };
  const onPerfilChange = p=>{setPerfil(p);if(!isDemo) fetchTop10(p,config);};

  const C = {
    card:{background:"#111110",border:"0.5px solid rgba(255,255,255,0.07)",borderRadius:13,padding:"20px 20px 18px"},
    label:{fontSize:10,fontWeight:500,textTransform:"uppercase",letterSpacing:".08em",color:"#444440",marginBottom:14},
  };

  return h("div",{style:{maxWidth:840,margin:"0 auto",padding:"22px 16px 56px"}},

    // Header
    h("header",{style:{display:"flex",alignItems:"center",gap:12,marginBottom:20}},
      h("div",{style:{width:38,height:38,borderRadius:11,background:"linear-gradient(135deg,#4ade80,#22d3ee)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,fontWeight:700,color:"#0a0a08",flexShrink:0}},"H"),
      h("div",{style:{flex:1}},
        h("div",{style:{fontSize:15,fontWeight:600,letterSpacing:"-0.01em"}},"Horizontes"),
        h("div",{style:{fontSize:11,color:"#444440",display:"flex",alignItems:"center",gap:5}},
          h("span",{style:{width:5,height:5,borderRadius:"50%",background:config.url?"#4ade80":"#f87171",display:"inline-block"}}),
          isDemo?`Demo · NVDA · datos del test de integración`:`Live · Supabase · ${activeTk}`
        )
      ),
      h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
        h("div",{style:{display:"flex",background:"#111110",border:"0.5px solid rgba(255,255,255,0.09)",borderRadius:9,overflow:"hidden",alignItems:"center"}},
          h("input",{value:inputTk,onChange:e=>setInputTk(e.target.value.toUpperCase()),onKeyDown:e=>e.key==="Enter"&&onSearch(),placeholder:"TICKER",style:{background:"none",border:"none",padding:"8px 10px",fontSize:13,fontWeight:500,color:"#e8e5e0",width:88,letterSpacing:".06em",fontFamily:"DM Mono,monospace"}}),
          h("button",{onClick:onSearch,style:{background:"#4ade80",color:"#0a0a08",padding:"8px 13px",fontSize:13,fontWeight:600,border:"none",letterSpacing:".02em"}},loading?"···":"→")
        ),
        h("button",{onClick:()=>setShowCfg(true),title:"Configurar Supabase",style:{background:"#111110",border:"0.5px solid rgba(255,255,255,0.09)",borderRadius:9,width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,color:config.url?"#4ade80":"#666"}},"⚙")
      )
    ),

    // Error
    error&&h("div",{style:{background:"rgba(248,113,113,0.08)",border:"0.5px solid rgba(248,113,113,0.3)",borderRadius:9,padding:"10px 14px",marginBottom:14,fontSize:11,color:"#f87171",lineHeight:1.5}},`⚠ ${error}`),

    // Demo notice
    isDemo&&h("div",{style:{background:"rgba(251,191,36,0.06)",border:"0.5px solid rgba(251,191,36,0.18)",borderRadius:9,padding:"9px 14px",marginBottom:14,fontSize:11,color:"#fbbf24",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}},
      h("span",null,"Modo demo — conectá Supabase para ver datos live de tu caché"),
      h("button",{onClick:()=>setShowCfg(true),style:{background:"rgba(251,191,36,0.12)",color:"#fbbf24",border:"0.5px solid rgba(251,191,36,0.25)",borderRadius:5,padding:"3px 10px",fontSize:10,fontWeight:600,whiteSpace:"nowrap"}},"Conectar →")
    ),

    // Score + Bloques
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}},

      // Score card
      h("div",{style:C.card},
        h("div",{style:C.label},"Score de Convicción"),
        current?h("div",null,
          h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center"}},
            h(GaugeArc,{score:current.score_final??0}),
            h("div",{className:"mono",style:{fontSize:44,fontWeight:500,color:scoreColor(current.score_final),lineHeight:1,marginTop:2,letterSpacing:"-0.02em"}},current.score_final?.toFixed(1)),
            h("div",{style:{fontSize:10,color:"#444440",marginBottom:8}},"/100 pts"),
            h("span",{style:{padding:"4px 14px",borderRadius:20,fontSize:11,fontWeight:600,letterSpacing:".04em",background:scoreBg(current.score_final),color:scoreColor(current.score_final),border:`0.5px solid ${scoreBorder(current.score_final)}`}},current.clasificacion)
          ),
          current.narrativa_titulo&&h("div",{style:{marginTop:16,borderTop:"0.5px solid rgba(255,255,255,0.06)",paddingTop:14}},
            h("div",{style:{fontSize:11,fontWeight:600,color:scoreColor(current.score_final),marginBottom:6}},current.narrativa_titulo),
            h("div",{style:{fontSize:11,color:"#888580",lineHeight:1.65}},current.narrativa_mensaje)
          ),
          current.alertas?.length>0&&h("div",{style:{marginTop:10}},
            ...current.alertas.map((a,i)=>h("div",{key:i,style:{fontSize:10,color:"#fbbf24",background:"rgba(251,191,36,0.07)",border:"0.5px solid rgba(251,191,36,0.18)",borderRadius:7,padding:"6px 10px",marginTop:5,lineHeight:1.5}},a))
          ),
          current.es_cedear&&h("div",{style:{marginTop:12,background:"rgba(167,139,250,0.08)",border:"0.5px solid rgba(167,139,250,0.2)",borderRadius:9,padding:"10px 12px"}},
            h("div",{style:{fontSize:10,fontWeight:600,color:"#a78bfa",marginBottom:5}},"CEDEAR · Módulo VRU"),
            h("div",{className:"mono",style:{fontSize:12,color:"#e8e5e0"}},"$",current.vru_valor_usd?.toFixed(2)," USD"),
            current.vru_alerta_trampa&&h("div",{style:{fontSize:10,color:"#f87171",marginTop:4}},"⚠ ALERTA TRAMPA DE DEVALUACIÓN")
          )
        ):h("div",{style:{color:"#444440",fontSize:12,textAlign:"center",padding:"30px 0"}},loading?"Consultando caché…":"Sin análisis para este perfil")
      ),

      // Bloques card
      h("div",{style:C.card},
        h("div",{style:C.label},"Ficha de Salud · Bloques"),
        current?h("div",null,
          ...Object.entries(BLOQUE_META).map(([key,meta])=>{
            const s   = current[`${key}_score_bruto`]??0;
            const peso= current[`${key}_peso`]??0;
            const apt = current[`${key}_aporte`]??0;
            const off = peso===0;
            return h("div",{key,style:{marginBottom:13,opacity:off?0.3:1}},
              h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:5}},
                h("div",{style:{width:26,height:26,borderRadius:7,background:meta.color+"16",border:`0.5px solid ${meta.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:600,color:meta.color,flexShrink:0}},meta.icon),
                h("div",{style:{flex:1,minWidth:0}},
                  h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
                    h("span",{style:{fontSize:12,fontWeight:500}},meta.label),
                    h("span",{className:"mono",style:{fontSize:13,fontWeight:500,color:off?"#333":meta.color}},off?"—":s.toFixed(0))
                  ),
                  h("div",{style:{fontSize:9,color:"#444440"}},off?"inactivo en este perfil":`${(peso*100).toFixed(0)}% peso · +${apt.toFixed(1)} pts`)
                )
              ),
              !off&&h("div",{style:{height:3,background:"rgba(255,255,255,0.05)",borderRadius:2,overflow:"hidden"}},
                h("div",{style:{height:"100%",width:`${Math.min(s,100)}%`,background:meta.color,borderRadius:2,transition:"width .55s ease",boxShadow:`0 0 4px ${meta.color}88`}})
              )
            );
          }),
          h("div",{style:{borderTop:"0.5px solid rgba(255,255,255,0.06)",paddingTop:12,marginTop:6,display:"flex",justifyContent:"space-between",alignItems:"center"}},
            h("span",{style:{fontSize:10,color:"#444440"}},"Score ponderado final"),
            h("span",{className:"mono",style:{fontSize:20,fontWeight:500,color:scoreColor(current.score_final)}},current.score_final?.toFixed(2))
          )
        ):h("div",{style:{color:"#444440",fontSize:12,textAlign:"center",padding:"30px 0"}},"—")
      )
    ),

    // Comparador perfiles
    h("div",{style:{...C.card,marginBottom:12}},
      h("div",{style:C.label},"Comparador de Horizontes"),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}},
        ...PERFILES.map(p=>{
          const s=scores[p.key];
          const active=p.key===perfil;
          const c=s?scoreColor(s.score_final):"#333";
          return h("button",{key:p.key,onClick:()=>s&&onPerfilChange(p.key),style:{background:active?c+"14":"rgba(255,255,255,0.02)",border:`0.5px solid ${active?c:"rgba(255,255,255,0.07)"}`,borderRadius:10,padding:"12px 8px",textAlign:"center",transition:"all .15s",opacity:s?1:0.45}},
            h("div",{style:{fontSize:11,fontWeight:500,color:active?c:"#888580"}},p.label),
            h("div",{style:{fontSize:9,color:"#444440",marginTop:1}},p.desc),
            h("div",{className:"mono",style:{fontSize:26,fontWeight:500,color:s?c:"#333",marginTop:8,letterSpacing:"-0.02em"}},s?s.score_final?.toFixed(0):"—"),
            h("div",{style:{fontSize:9,color:s?c:"#333",marginTop:2}},s?.clasificacion||"sin caché")
          );
        })
      )
    ),

    // Top 10
    !isDemo&&h("div",{style:{...C.card,marginBottom:12}},
      h("div",{style:C.label},`🏆 Top 10 — Perfil ${PERFILES.find(p=>p.key===perfil)?.label||perfil}`),
      loadingTop?h("div",{style:{color:"#444440",fontSize:11,textAlign:"center",padding:"16px 0"}},"Cargando ranking..."):
      top10.length===0?h("div",{style:{color:"#444440",fontSize:11,textAlign:"center",padding:"16px 0"}},"Cargá más tickers con el warmup para ver el ranking"):
      h("div",{style:{display:"flex",flexDirection:"column",gap:4}},
        ...top10.map((row,i)=>{
          const c=scoreColor(row.score_final);
          const medals=["🥇","🥈","🥉"];
          return h("div",{key:row.ticker,style:{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:"rgba(255,255,255,0.02)",borderRadius:8,border:`0.5px solid rgba(255,255,255,0.05)`}},
            h("div",{style:{fontSize:13,width:24,textAlign:"center"}},medals[i]||`${i+1}`),
            h("div",{className:"mono",style:{fontSize:13,fontWeight:500,color:"#e8e5e0",flex:1}},row.ticker,row.es_cedear?h("span",{style:{fontSize:9,color:"#a78bfa",marginLeft:4}},"CEDEAR"):""),
            h("div",{className:"mono",style:{fontSize:15,fontWeight:500,color:c}},row.score_final?.toFixed(1)),
            h("span",{style:{fontSize:9,padding:"2px 8px",borderRadius:10,background:c+"18",color:c,border:`0.5px solid ${c}44`}},row.clasificacion)
          );
        })
      )
    ),

    // Explainer
    h("div",{style:{...C.card,marginBottom:12,background:"#0d0d0b",border:"0.5px solid rgba(74,222,128,0.12)"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:12}},
        h("div",{style:{fontSize:16}},"📖"),
        h("div",{style:{fontSize:12,fontWeight:600,color:"#4ade80"}},"¿Cómo leer este dashboard?")
      ),
      h("div",{style:{fontSize:11,color:"#888580",lineHeight:1.8}},
        h("p",{style:{marginBottom:10}},
          "Horizontes analiza acciones usando ",h("strong",{style:{color:"#e8e5e0"}},"4 pilares académicos"),
          " combinados según tu horizonte de inversión:"
        ),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}},
          ...[
            {icon:"G",color:"#60a5fa",name:"Graham",desc:"Seguridad del capital. Evalúa liquidez, deuda y margen de seguridad. Protege contra quiebras."},
            {icon:"M",color:"#22d3ee",name:"Murphy",desc:"Análisis técnico. RSI, medias móviles y volumen. Detecta el momento óptimo de entrada."},
            {icon:"L",color:"#4ade80",name:"Lynch",desc:"Crecimiento sostenible. PEG ratio, EPS y clasificación del negocio. Identifica 'ten-baggers'."},
            {icon:"IP",color:"#a78bfa",name:"InvestingPro",desc:"Salud financiera. ROIC, márgenes y fair value. Mide la calidad intrínseca del negocio."},
          ].map(b=>h("div",{key:b.name,style:{background:"rgba(255,255,255,0.02)",borderRadius:8,padding:"10px 12px",border:`0.5px solid ${b.color}22`}},
            h("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:4}},
              h("div",{style:{width:20,height:20,borderRadius:5,background:b.color+"20",border:`0.5px solid ${b.color}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:700,color:b.color}},b.icon),
              h("span",{style:{fontSize:11,fontWeight:600,color:"#e8e5e0"}}),b.name
            ),
            h("div",{style:{fontSize:10,color:"#555550",lineHeight:1.6}},b.desc)
          ))
        ),
        h("div",{style:{borderTop:"0.5px solid rgba(255,255,255,0.05)",paddingTop:10,marginBottom:10}},
          h("div",{style:{fontSize:10,fontWeight:600,color:"#e8e5e0",marginBottom:6}},"Clasificaciones del Score (0–100)"),
          h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
            ...[
              {label:"STRONG BUY",range:"≥75",color:"#4ade80",desc:"Alta convicción. Todos los pilares alineados."},
              {label:"ACCUMULATE",range:"≥55",color:"#60a5fa",desc:"Buena oportunidad. Acumular gradualmente."},
              {label:"HOLD",range:"≥35",color:"#fbbf24",desc:"En espera. Mantener si ya está en cartera."},
              {label:"AVOID",range:"<35",color:"#f87171",desc:"No cumple filtros. Preservar capital."},
            ].map(cl=>h("div",{key:cl.label,style:{flex:"1 1 0",minWidth:100,background:cl.color+"0f",border:`0.5px solid ${cl.color}33`,borderRadius:7,padding:"7px 8px"}},
              h("div",{style:{fontSize:10,fontWeight:700,color:cl.color}},cl.label," ",h("span",{style:{fontWeight:400,opacity:.7}},cl.range)),
              h("div",{style:{fontSize:9,color:"#555550",marginTop:3,lineHeight:1.5}},cl.desc)
            ))
          )
        ),
        h("div",{style:{borderTop:"0.5px solid rgba(255,255,255,0.05)",paddingTop:10,fontSize:10,color:"#555550",lineHeight:1.7}},
          h("span",{style:{color:"#fbbf24",fontWeight:600}},"⚠ Importante: "),
          "Este sistema no constituye asesoramiento financiero. Los scores son herramientas cuantitativas basadas en datos públicos de Yahoo Finance. Siempre consultá con un asesor antes de invertir. El módulo CEDEAR/VRU detecta si una acción sube en pesos argentinos pero cae en dólares, evitando la 'trampa de devaluación'."
        )
      )
    ),

    // Semáforo
    h("div",{style:C.card},
      h("div",{style:C.label},"Semáforo Macro · Contexto Dalio"),
      h("div",{style:{fontSize:11,color:"#555550",lineHeight:1.7,marginBottom:12,paddingBottom:10,borderBottom:"0.5px solid rgba(255,255,255,0.05)"}},
        "Inspirado en los ",h("strong",{style:{color:"#e8e5e0"}},"Ciclos de Deuda de Ray Dalio"),
        ", el Semáforo Macro contextualiza cada análisis individual dentro del entorno económico global. ",
        "Un activo puede tener excelentes fundamentales pero estar en el momento equivocado del ciclo. ",
        h("span",{style:{color:"#f87171"}},"🔴 Rojo"),
        " = condiciones adversas (puede penalizar scores). ",
        h("span",{style:{color:"#fbbf24"}},"🟡 Amarillo"),
        " = cautela o transición. ",
        h("span",{style:{color:"#4ade80"}},"🟢 Verde"),
        " = condiciones favorables para invertir."
      ),
      h("div",{style:{display:"flex",flexDirection:"column",gap:6}},
        ...semaforo.map((item,i)=>{
          const sc=SEM[item.estado]||SEM.AMARILLO;
          return h("div",{key:i,style:{display:"flex",alignItems:"center",gap:10,background:sc.bg,border:`0.5px solid ${sc.dot}22`,borderRadius:8,padding:"9px 12px"}},
            h("div",{style:{width:7,height:7,borderRadius:"50%",background:sc.dot,flexShrink:0,boxShadow:`0 0 5px ${sc.dot}`}}),
            h("div",{style:{flex:1,fontSize:11,fontWeight:500}},item.indicador),
            h("div",{className:"mono",style:{fontSize:12,color:sc.dot,fontWeight:500}},item.valor_actual," ",h("span",{style:{fontSize:9,fontWeight:400,color:"#555550"}},item.unidad)),
            h("div",{style:{fontSize:9,color:"#444440",textAlign:"right",maxWidth:180,lineHeight:1.4}},`${item.region} · ${item.notas}`)
          );
        })
      )
    ),

    // Cache timestamp
    current?.calculado_at&&!isDemo&&h("div",{style:{marginTop:12,textAlign:"center",fontSize:10,color:"#333"}},
      `Calculado ${new Date(current.calculado_at).toLocaleString("es-AR")} · Expira ${new Date(current.expira_at).toLocaleString("es-AR")}`
    ),

    showCfg&&h(ConfigModal,{current:config,onSave:onCfgSave,onClose:()=>setShowCfg(false)})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
